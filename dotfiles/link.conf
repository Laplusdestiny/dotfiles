# ファイルと配置先のマッピング設定
# フォーマット: ファイル名<TAB>配置先
# 配置先は $HOME, $XDG_CONFIG_HOME などの環境変数が使える
.bash_profile	$HOME/.bash_profile
.bashrc	$HOME/.bashrc
.gitconfig	$HOME/.gitconfig
.nanorc	$HOME/.nanorc
jujutsu_config.toml	${XDG_CONFIG_HOME:-$HOME/.config}/jj/config.toml
.jj_completion.bash	$HOME/.jj_completion.bash
.gh_completion.bash	$HOME/.gh_completion.bash
gpg-agent.conf	$HOME/.gnupg/gpg-agent.conf
